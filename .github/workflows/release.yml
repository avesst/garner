name: release

# A semver tag (v1.2.3, v1.3.0-rc.1) builds the .deb and .rpm, installs
# them in containers, and publishes them with SHA256SUMS as a GitHub
# release; a tag with a pre-release suffix gives a pre-release. Other
# tags starting with v are ignored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # semver.org's grammar with a leading v.
          n='(0|[1-9][0-9]*)'
          id='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          re="^v$n\.$n\.$n(-$id(\.$id)*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?\$"
          if printf '%s\n' "$TAG" | grep -Eq "$re"; then
            echo ok=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not a semver tag; no release"
            echo ok=false >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: semver
    if: needs.semver.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser reads the tags
      # Release notes are written by hand in docs/releases/<tag>.md, before
      # the tag. A pre-release without its own file uses its release's
      # (v1.3.0-rc.1 uses v1.3.0.md). No notes, no release.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || notes="docs/releases/${TAG%%[-+]*}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::no release notes for $TAG: add docs/releases/$TAG.md"
            exit 1
          fi
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends just rpm
      - run: just check
      # Build and test the packages before anything is published.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean --skip=publish --release-notes ${{ env.RELEASE_NOTES }}
      - run: GARNER_PACKAGES="$PWD/dist" go test -tags e2e -count=1 -v -run TestPackages ./e2e
      # The same build again, now published: the builds are reproducible.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean --release-notes ${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
