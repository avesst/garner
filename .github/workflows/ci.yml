name: ci

# Skipped when only Markdown changes: no job reads it. The man pages in
# packaging/ are not Markdown and still run the packages job.
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest patch release of the go.mod version, not its .0.
          go-version: "1.26"
          check-latest: true
      # The image has dpkg and gpg; rpm is added so that no comparison
      # against a real tool is skipped.
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends just rpm
      - run: just check
      - name: Fail on tests skipped for a missing tool
        run: |
          go test -count=1 -v ./internal/deb ./internal/rpm ./internal/signing > tool-tests.log
          if grep -- '--- SKIP' tool-tests.log; then exit 1; fi
      - run: just build

  # garner's own .deb and .rpm, built as a release builds them and
  # installed in Debian, Ubuntu, AlmaLinux and Fedora containers.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the snapshot version counts from the last tag
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0 # goreleaser_version in the justfile
          args: release --snapshot --clean --skip=publish
      - run: GARNER_PACKAGES="$PWD/dist" go test -tags e2e -count=1 -v -run TestPackages ./e2e

  # The MVP runs on SQLite only; this keeps the schema portable to
  # PostgreSQL for multi-node support later (design section 18).
  migrations-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-migrations-postgres.sh
