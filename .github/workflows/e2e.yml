name: e2e

# Real apt and dnf clients in containers, against garner in-process and
# from its container image. Skipped when only documentation, contrib
# files or scripts change; run it by hand with workflow_dispatch.
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "contrib/**"
      - "scripts/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "contrib/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends just
      - run: just e2e
