# garner's release build: the static binary, as .deb and .rpm packages for
# amd64. A semver tag (v1.2.3, v1.3.0-rc.1) publishes a GitHub release;
# `just packages` builds a snapshot into dist/ without publishing.
version: 2
project_name: garner

before:
  hooks:
    - mkdir -p build/man
    - sh -c 'gzip -9n < packaging/garner.1 > build/man/garner.1.gz'
    - sh -c 'gzip -9n < packaging/garner.yaml.5 > build/man/garner.yaml.5.gz'
    # The contrib unit describes a manual install from /usr/local/bin.
    - sh -c "{ cat packaging/garner.service.head; sed '1,/^$/d; s|/usr/local/bin/garner|/usr/bin/garner|g' packaging/garner.service; } > build/garner.service"

builds:
  - id: garner
    main: ./cmd/garner
    binary: garner
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible: the same commit gives the same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"

# The bare static binary, besides the packages; no tarballs.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: packages
    package_name: garner
    formats: [deb, rpm]
    bindir: /usr/bin
    vendor: garner
    maintainer: garner maintainers <garner@localhost>
    homepage: https://github.com/avesst/garner
    license: 0BSD
    description: |-
      Internal repository for packages and container images
      garner serves signed apt and dnf repositories and an OCI container
      registry, filled from uploads and pushes and from releases and images
      synced from GitHub, GitLab, Forgejo/Gitea and container registries.
      createrepo_c, rpmsign and gpg are needed for rpm support only.
    section: admin
    priority: optional
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: build/garner.service
        dst: /usr/lib/systemd/system/garner.service
      - src: packaging/garner.sysusers
        dst: /usr/lib/sysusers.d/garner.conf
      - src: packaging/garner.tmpfiles
        dst: /usr/lib/tmpfiles.d/garner.conf
      # Local edits survive upgrades (dpkg conffile, rpm %config(noreplace)).
      - src: packaging/garner.yaml
        dst: /etc/garner/garner.yaml
        type: config|noreplace
      - src: build/man/garner.1.gz
        dst: /usr/share/man/man1/garner.1.gz
      - src: build/man/garner.yaml.5.gz
        dst: /usr/share/man/man5/garner.yaml.5.gz
      - src: LICENSE
        dst: /usr/share/doc/garner/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/garner/LICENSE
        type: license
        packager: rpm
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
    overrides:
      deb:
        recommends: [createrepo-c, rpm, gpg, gpg-agent, gpgconf]
      rpm:
        recommends: [createrepo_c, rpm-sign, gnupg2]

checksum:
  # The distributions' name, for sha256sum -c; garner's sync knows it too.
  name_template: SHA256SUMS

# Builds between tags: the next patch version as a semver pre-release,
# ordered by commit time, so package managers sort them correctly.
snapshot:
  version_template: "{{ incpatch .Version }}-dev.{{ .CommitTimestamp }}+{{ .ShortCommit }}"

release:
  # Published at once: the workflow has checked and installed the packages
  # before this runs. v1.3.0-rc.1 and the like are marked as pre-releases,
  # which /releases/latest and garner's own sync skip by default.
  draft: false
  prerelease: auto

# Release notes are written by hand in docs/releases/<tag>.md. The release
# workflow passes them with --release-notes, which takes the place of a
# changelog from commits. changelog.disable would drop them as well: the
# changelog pipe is what loads the file.
